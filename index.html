<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Marauder's Map</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&display=swap" rel="stylesheet">
    <style>
        body, html {
            margin: 0; padding: 0;
            width: 100vw; height: 100vh;
            overflow: hidden;
            background-color: #f0cfa6;
            font-family: 'Cinzel', 'Georgia', serif;
            user-select: none;
            -webkit-user-select: none;
        }

        /* 3D Pitched Perspective */
        #map-container {
            perspective: 800px;
            width: 100vw;
            height: 100vh;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        #map-layer {
            position: absolute;
            left: 50%; top: 50%;
            /* Pitches the map backward to give depth */
            transform: rotateX(40deg) scale(0.55);
            transform-style: preserve-3d;
            width: 0; height: 0; /* Centered origin point */
        }

        #background {
            position: absolute;
            left: 0; top: 0;
            width: 4092px; height: 6120px;
            background-image: url('background.webp');
            background-size: 100% 100%;
            transform-origin: 0 0;
            /* Added smooth transitions for non-linear bumps */
            will-change: transform;
        }

        /* UI Elements */
        .map-label {
            position: absolute;
            color: #492210;
            font-size: 20px;
            font-weight: bold;
            text-align: center;
            line-height: 1.1;
            text-shadow: 2px 2px 4px #f5dbbc, -2px -2px 4px #f5dbbc, 2px -2px 4px #f5dbbc, -2px 2px 4px #f5dbbc;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.5s ease;
            white-space: nowrap;
            z-index: 5;
        }

        .footprint {
            position: absolute;
            width: 15px; height: 30px;
            opacity: 0;
            filter: drop-shadow(2px 2px 6px #f5dbbc);
            transform-origin: center center;
            transition: opacity 0.5s ease, transform 0.5s ease;
            z-index: 2;
        }

        .footprint-inner {
            width: 100%; height: 100%;
            animation: footstep 0.4s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }

        @keyframes footstep {
            0% { opacity: 0; transform: scale(0.8) translateY(10px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }

        #arrow {
            position: absolute;
            width: 50px; height: 50px;
            filter: drop-shadow(2px 2px 6px #f5dbbc);
            margin-left: -25px; margin-top: -25px;
            z-index: 10;
            transition: left 0.1s linear, top 0.1s linear;
            pointer-events: none;
        }

        #arrow svg.arrow-path {
            animation: expand-arrow 4s infinite ease-in-out;
            transform-origin: center center;
            position: relative;
            z-index: 2;
        }

        .star {
            position: absolute;
            width: 20px; height: 20px;
            opacity: 0;
            z-index: 3;
            animation: twinkle-star 4s infinite ease-in-out;
            filter: drop-shadow(0 0 3px #ffffff);
        }

        @keyframes expand-arrow {
            0% { transform: scale(1); }
            8% { transform: scale(1.3); }
            28% { transform: scale(1.3); }
            40% { transform: scale(1); }
            100% { transform: scale(1); }
        }

        @keyframes twinkle-star {
            0% { opacity: 0; transform: scale(0) rotate(0deg); }
            8% { opacity: 1; transform: scale(1.2) rotate(45deg); }
            20% { opacity: 0; transform: scale(0) rotate(90deg); }
            100% { opacity: 0; transform: scale(0) rotate(90deg); }
        }

        #toast {
            position: absolute;
            bottom: -150px; left: 50%;
            transform: translateX(-50%);
            background: #492210;
            color: #f0cfa6;
            padding: 15px 40px;
            border-radius: 30px;
            font-size: 22px;
            font-weight: bold;
            text-align: center;
            transition: bottom 0.4s ease;
            z-index: 20;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            pointer-events: none;
            white-space: nowrap;
        }
        #toast.show { bottom: 50px; }

        #start-screen {
            position: absolute;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: linear-gradient(rgba(240, 207, 166, 0.9), rgba(240, 207, 166, 0.9)), url('background.webp') no-repeat center center;
            background-size: cover;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            font-size: 32px; color: #492210; font-weight: bold;
            z-index: 100; text-align: center; padding: 20px;
            box-sizing: border-box;
            gap: 40px;
        }

        #start-button {
            background-color: #492210;
            color: #f0cfa6;
            border: none;
            padding: 15px 50px;
            font-family: 'Cinzel', 'Georgia', serif;
            font-size: 28px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 2px 2px 6px rgba(0,0,0,0.3);
            transition: transform 0.1s, box-shadow 0.1s;
        }
        
        #start-button:active {
            transform: translateY(2px);
            box-shadow: 0 0 2px rgba(0,0,0,0.3);
        }

        #test-button {
            background-color: transparent;
            color: #492210;
            border: 2px solid #492210;
            padding: 10px 40px;
            font-family: 'Cinzel', 'Georgia', serif;
            font-size: 20px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.1s, background-color 0.2s, color 0.2s;
            margin-top: -20px;
        }

        #test-button:active {
            transform: translateY(2px);
        }
    </style>
</head>
<body>
    <audio id="bg-music" src="harry.mp3" preload="auto" loop></audio>

    <div id="start-screen">
        <div>I solemnly swear that I am up to no good.</div>
        <button id="start-button" onclick="startApp()">START</button>
        <button id="test-button" onclick="startTestApp()">TEST TRACK</button>
    </div>

    <div id="map-container">
        <div id="map-layer">
            <div id="background"></div>
        </div>
        <div id="ui-layer" style="position: absolute; top:0; left:0; width:100%; height:100%; pointer-events:none; z-index:15;"></div>
    </div>

    <!-- UI Overlay Layer -->
    <div id="arrow">
        <div class="star" style="top: 0px; left: 2px; animation-delay: 0s;">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" style="width:100%; height:100%;"><path fill="#ffffff" d="M12 0l2 8 8 2-8 2-2 8-2-8-8-2 8-2z"/></svg>
        </div>
        <div class="star" style="top: 20px; right: -5px; animation-delay: 0.2s;">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" style="width:100%; height:100%;"><path fill="#ffffff" d="M12 0l2 8 8 2-8 2-2 8-2-8-8-2 8-2z"/></svg>
        </div>
        <div class="star" style="bottom: -2px; left: 20px; animation-delay: 0.4s;">
            <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" style="width:100%; height:100%;"><path fill="#ffffff" d="M12 0l2 8 8 2-8 2-2 8-2-8-8-2 8-2z"/></svg>
        </div>
        <svg class="arrow-path" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" style="width:100%; height:100%;">
            <path fill="#492210" d="M50,10 L85,85 L50,65 L15,85 Z" />
        </svg>
    </div>
    
    <div id="toast">Wrong Way</div>
    
    <div id="status-letter" style="position: absolute; top: 20px; right: 20px; font-size: 32px; color: #492210; font-weight: bold; z-index: 100; opacity: 0; transition: opacity 1s ease; pointer-events: none; text-shadow: 2px 2px 4px #f5dbbc, -2px -2px 4px #f5dbbc, 2px -2px 4px #f5dbbc, -2px 2px 4px #f5dbbc;"></div>

    <script>
        // System Config
        const DEBUG_MODE = false;
        const INITIAL_X = 2034;
        const INITIAL_Y = 3720;

        window.addEventListener('DOMContentLoaded', () => {
            if (!DEBUG_MODE) {
                const testBtn = document.getElementById('test-button');
                if (testBtn) testBtn.style.display = 'none';
            }
        });
        const DEST_X = 1655;
        const DEST_Y = 1252;
        const PIXELS_PER_METER = 45;

        // Coordinates & Tracking
        let target_map_x = INITIAL_X;
        let target_map_y = INITIAL_Y;
        let map_x = INITIAL_X;
        let map_y = INITIAL_Y;

        let firstPos = null;
        let gpsHistory = [];
        let pathHistory = [];
        let lastDistTime = 0;

        // Footprint state
        let last_footprint_x = INITIAL_X;
        let last_footprint_y = INITIAL_Y;
        let isLeftFoot = true;
        let activeFootprints = [];
        let arrowOffsetX = 0;

        function attemptPlayAudio() {
            let bgMusic = document.getElementById('bg-music');
            if (bgMusic) {
                bgMusic.volume = 0.5; // Default volume
                bgMusic.loop = true; // Loop the music forever
                bgMusic.play().catch(e => console.warn('Audio playback failed:', e));
            }
        }

        // Labels definitions
        const labelData =[
            { name: "Old Manor", x: 2022, y: 3336 },
            { name: "Herb Garden", x: 1644, y: 4464 },
            { name: "Great Hall", x: 2466, y: 4200 },
            { name: "The Lane", x: 2070, y: 5232 },
            { name: "Crest Hill", x: 2802, y: 3390 },
            { name: "Outer Grounds", x: 2302, y: 2734 },
            { name: "Forbidden Forest", x: 2376, y: 1770 },
            { name: "Hippogriff Paddock", x: 1324, y: 2582 },
            { name: "Centaur Glade", x: 1298, y: 1056 }
        ];

        let labels = labelData.map((l, i) => ({
            id: 'label-' + i, name: l.name,
            targetX: l.x, targetY: l.y,
            x: l.x, y: l.y, vx: 0, vy: 0
        }));

        function startTestApp() {
            document.getElementById('start-screen').style.display = 'none';
            attemptPlayAudio();
            initMap();

            // Waypoints: West -> South -> Zig-zag to Destination
            // West is +Y in this coordinate system, South is +X
            const testWaypoints = [
                {x: INITIAL_X, y: INITIAL_Y}, // Start
                {x: INITIAL_X, y: INITIAL_Y + 600}, // Walk West (+Y)
                {x: INITIAL_X + 400, y: INITIAL_Y + 600}, // Walk South (+X)
                // Zig zags roughly pointing to 1655, 1252
                {x: 2300, y: 3200}, // Zig
                {x: 2400, y: 2600}, // Zag
                {x: 1800, y: 2200}, // Zig
                {x: 1900, y: 1600}, // Zag
                {x: DEST_X, y: DEST_Y}  // Destination
            ];
            
            let currentWaypoint = 0;
            let fakeGpsX = INITIAL_X;
            let fakeGpsY = INITIAL_Y;
            let fakeVelX = 0;
            let fakeVelY = 0;
            const TEST_SPEED = 0.8; // Slower speed per frame

            function testTick() {
                if (currentWaypoint < testWaypoints.length) {
                    let wp = testWaypoints[currentWaypoint];
                    let dx = wp.x - fakeGpsX;
                    let dy = wp.y - fakeGpsY;
                    let dist = Math.hypot(dx, dy);

                    if (dist < 40) {
                        currentWaypoint++;
                    } else {
                        // Smooth inertial steering
                        let targetVx = (dx / dist) * TEST_SPEED;
                        let targetVy = (dy / dist) * TEST_SPEED;
                        fakeVelX += (targetVx - fakeVelX) * 0.05;
                        fakeVelY += (targetVy - fakeVelY) * 0.05;
                        
                        fakeGpsX += fakeVelX;
                        fakeGpsY += fakeVelY;
                    }

                    // Feed fake positional data as if it were real GPS
                    gpsHistory.push({ x: fakeGpsX, y: fakeGpsY });
                    if (gpsHistory.length > 20) gpsHistory.shift();

                    target_map_x = gpsHistory.reduce((s, p) => s + p.x, 0) / gpsHistory.length;
                    target_map_y = gpsHistory.reduce((s, p) => s + p.y, 0) / gpsHistory.length;
                }
                requestAnimationFrame(testTick);
            }
            
            requestAnimationFrame(testTick);
            requestAnimationFrame(updateFrame);
        }

        function startApp() {
            document.getElementById('start-screen').style.display = 'none';
            attemptPlayAudio();
            initMap();

            if (navigator.geolocation) {
                navigator.geolocation.watchPosition(
                    pos => {
                        let lat = pos.coords.latitude;
                        let lon = pos.coords.longitude;
                        if (!firstPos) {
                            const B_LAT = 45.03777754294026, B_LON = -78.48257497380403;
                            const J_LAT = 44.6223661518286, J_LON = -79.49627584749986;
                            
                            function getDistance(lat1, lon1, lat2, lon2) {
                                const R = 6371e3;
                                const p1 = lat1 * Math.PI/180;
                                const p2 = lat2 * Math.PI/180;
                                const dp = (lat2-lat1) * Math.PI/180;
                                const dl = (lon2-lon1) * Math.PI/180;
                                const a = Math.sin(dp/2) * Math.sin(dp/2) +
                                          Math.cos(p1) * Math.cos(p2) *
                                          Math.sin(dl/2) * Math.sin(dl/2);
                                const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
                                return R * c;
                            }
                            
                            let distB = getDistance(lat, lon, B_LAT, B_LON);
                            let distJ = getDistance(lat, lon, J_LAT, J_LON);
                            let displayLetter = 'N';
                            
                            if (distB <= 500) {
                                firstPos = { lat: B_LAT, lon: B_LON };
                                displayLetter = 'B';
                            } else if (distJ <= 500) {
                                firstPos = { lat: J_LAT, lon: J_LON };
                                displayLetter = 'J';
                            } else {
                                firstPos = { lat, lon };
                            }
                            
                            let statusEl = document.getElementById('status-letter');
                            if (statusEl && DEBUG_MODE) {
                                statusEl.innerText = displayLetter;
                                statusEl.style.opacity = 1;
                                setTimeout(() => { statusEl.style.opacity = 0; }, 5000);
                            }
                        }

                        // Deltas in degrees mapping to meters
                        let dLat = lat - firstPos.lat;
                        let dLon = lon - firstPos.lon;

                        let dy_meters = dLon * 111320 * Math.cos(firstPos.lat * Math.PI / 180); // East
                        let dx_meters = dLat * 111320; // North
                        
                        // Top of screen is East, Left of screen is North
                        let new_target_x = INITIAL_X - (dx_meters * PIXELS_PER_METER); 
                        let new_target_y = INITIAL_Y - (dy_meters * PIXELS_PER_METER); 

                        // Accumulate and average GPS to prevent jitter
                        gpsHistory.push({ x: new_target_x, y: new_target_y });
                        if (gpsHistory.length > 5) gpsHistory.shift();

                        target_map_x = gpsHistory.reduce((s, p) => s + p.x, 0) / gpsHistory.length;
                        target_map_y = gpsHistory.reduce((s, p) => s + p.y, 0) / gpsHistory.length;
                    },
                    err => console.warn(err),
                    { enableHighAccuracy: true, maximumAge: 1000, timeout: 5000 }
                );
            }
            
            // Fallback bindings for Desktop testing
            window.addEventListener('keydown', (e) => {
                if (e.key === 'ArrowUp') target_map_y -= 50;   // Walk East
                if (e.key === 'ArrowDown') target_map_y += 50; // Walk West
                if (e.key === 'ArrowLeft') target_map_x -= 50; // Walk North
                if (e.key === 'ArrowRight') target_map_x += 50;// Walk South
                gpsHistory.push({ x: target_map_x, y: target_map_y });
                if (gpsHistory.length > 5) gpsHistory.shift();
            });

            requestAnimationFrame(updateFrame);
        }

        function initMap() {
            let bg = document.getElementById('background');
            let uiLayer = document.getElementById('ui-layer');

            // Draw Destination marker on map-layer so it locks perfectly with camera perspective
            let destMarker = document.createElement('div');
            destMarker.id = 'dest-marker';
            // Scale up slightly since map-layer is visually scaled by 0.55
            destMarker.style.cssText = `position: absolute; top:0; left:0; width:72px; height:72px; display:flex; justify-content:center; align-items:center; color: #492210; font-size: 64px; text-shadow: 3px 3px 10px #f5dbbc, -3px -3px 10px #f5dbbc; z-index: 10;`;
            destMarker.innerHTML = `
                <div class="dest-stars" style="position: absolute; top:0; left:0; width:100%; height:100%; opacity:0; transition: opacity 0.3s ease; pointer-events:none; z-index: 12;">
                    <div class="star" style="top: -8px; left: -8px; width: 36px; height: 36px; animation-delay: 0s;">
                        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" style="width:100%; height:100%;"><path fill="#ffffff" d="M12 0l2 8 8 2-8 2-2 8-2-8-8-2 8-2z"/></svg>
                    </div>
                    <div class="star" style="top: 27px; right: -8px; width: 36px; height: 36px; animation-delay: 0.2s;">
                        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" style="width:100%; height:100%;"><path fill="#ffffff" d="M12 0l2 8 8 2-8 2-2 8-2-8-8-2 8-2z"/></svg>
                    </div>
                    <div class="star" style="bottom: -8px; left: 18px; width: 36px; height: 36px; animation-delay: 0.4s;">
                        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg" style="width:100%; height:100%;"><path fill="#ffffff" d="M12 0l2 8 8 2-8 2-2 8-2-8-8-2 8-2z"/></svg>
                    </div>
                </div>
                <div class="dest-icon" style="position: relative; z-index: 11; font-weight: bold; line-height:1;">✖</div>
            `;
            document.getElementById('background').appendChild(destMarker);

            // Setup Labels in UI tracking layer
            labels.forEach(l => {
                let el = document.createElement('div');
                el.className = 'map-label';
                el.id = l.id;
                el.innerHTML = l.name.replace(' ', '<br>');
                // Default styles overwritten in updateFrame
                el.style.transform = `translate(-50%, -50%)`;
                uiLayer.appendChild(el);
            });
        }

        function updateFrame(time) {
            // 1. Smooth Camera Glide
            map_x += (target_map_x - map_x) * 0.05;
            map_y += (target_map_y - map_y) * 0.05;
            
            document.getElementById('background').style.transform = `translate(${-map_x}px, ${-map_y}px)`;
            
            // 2. Footprint Spawning
            let distWalked = Math.hypot(map_x - last_footprint_x, map_y - last_footprint_y);
            if (distWalked > 25) {
                let angle = Math.atan2(map_y - last_footprint_y, map_x - last_footprint_x);
                // Offset left or right foot relative to path
                let offsetX = Math.cos(angle + Math.PI/2) * (isLeftFoot ? -7 : 7);
                let offsetY = Math.sin(angle + Math.PI/2) * (isLeftFoot ? -7 : 7);
                
                spawnFootprint(map_x + offsetX, map_y + offsetY, angle);
                
                last_footprint_x = map_x;
                last_footprint_y = map_y;
                isLeftFoot = !isLeftFoot;
            }

            // 3. Label Screen Mapping
            const SCALE = 0.55;
            const PITCH_COS = 0.766; // Math.cos(40deg)
            let visibleW = window.innerWidth;
            let visibleH = window.innerHeight;
            let pad = 20;

            labels.forEach(l => {
                let el = document.getElementById(l.id);
                // Get pre-calculated dims or approx
                let hw = (el.offsetWidth || 120) / 2;
                let hh = (el.offsetHeight || 45) / 2;

                // Project to screen space
                let screenX = visibleW/2 + (l.x - map_x) * SCALE;
                let screenY = visibleH/2 + (l.y - map_y) * SCALE * PITCH_COS;

                // Clamp to screen bounds to keep text fully visible
                let clampedX = Math.max(hw + pad, Math.min(visibleW - hw - pad, screenX));
                let clampedY = Math.max(hh + pad, Math.min(visibleH - hh - pad, screenY));

                el.style.transform = `translate(-50%, -50%) translate(${clampedX}px, ${clampedY}px)`;

                // Distance fade
                let distToCenter = Math.hypot(l.x - map_x, l.y - map_y);
                let alpha = 0;
                if (distToCenter < 1000) {
                    alpha = Math.min(1.0, (1000 - distToCenter) / 400); 
                    el.style.opacity = alpha;
                } else {
                    el.style.opacity = 0;
                }
                
                l.clampedX = clampedX;
                l.clampedY = clampedY;
                l.hw = hw;
                l.hh = hh;
                l.alpha = alpha;
            });

            // 4. Arrow Navigation
            let arrow = document.getElementById('arrow');
        let destMarkerEl = document.getElementById('dest-marker');
        
        // Get exact 2D screen coordinates of the destination marker's center
        let destMarkerRect = destMarkerEl.getBoundingClientRect();
        let destScreenX = destMarkerRect.left + destMarkerRect.width / 2;
        let destScreenY = destMarkerRect.top + destMarkerRect.height / 2;

        let screenDx = destScreenX - visibleW / 2;
        let screenDy = destScreenY - visibleH / 2;
        let angle = Math.atan2(screenDy, screenDx); 
        
        let arrW = visibleW / 2 - 50;
        let arrH = visibleH / 2 - 50;

        let absCos = Math.max(0.001, Math.abs(Math.cos(angle)));
        let absSin = Math.max(0.001, Math.abs(Math.sin(angle)));
        let edgeMag = Math.min(arrW / absCos, arrH / absSin);

        let targetMag = Math.hypot(screenDx, screenDy);

        // Distance from center is capped at the edge.
        // If the target comes on screen, the arrow moves inward towards it.
        // We subtract enough from the target magnitude so the arrow hits the edge of the X instead of overlapping its center.
        let renderMag = Math.min(edgeMag, Math.max(0, targetMag - 65));
        let baseArrowX = visibleW / 2 + Math.cos(angle) * renderMag;
        let baseArrowY = visibleH / 2 + Math.sin(angle) * renderMag;

            // Avoid text labels
            let targetOffsetX = 0;
            // Radius of 25px gives less visual overlap (15px remaining) instead of sinking to the text rim
            let arrowRadius = 25; 
            labels.forEach(l => {
                if (l.alpha > 0.1) {
                    let dx = baseArrowX + targetOffsetX - l.clampedX;
                    let dy = baseArrowY - l.clampedY;
                    let adx = Math.abs(dx);
                    let ady = Math.abs(dy);
                    
                    if (adx < l.hw + arrowRadius && ady < l.hh + arrowRadius) {
                        // Push horizontally
                        if (dx >= 0) {
                            targetOffsetX += (l.hw + arrowRadius - dx);
                        } else {
                            targetOffsetX -= (l.hw + arrowRadius - adx);
                        }
                    }
                }
            });
            
            // Reduced steering speed so it glances outward gracefully and slowly
            arrowOffsetX += (targetOffsetX - arrowOffsetX) * 0.04;

            arrow.style.left = `calc(${baseArrowX + arrowOffsetX}px)`;
            arrow.style.top = `calc(${baseArrowY}px)`;

            let arrowDeg = angle * 180 / Math.PI + 90;
            arrow.style.transform = `rotate(${arrowDeg}deg)`;

            // Fade out as destination gets closer to the center of the screen
            // Mapped to fade rapidly over the last half: goes from 1.0 down to 0 at 50%
            let arrowOpacity = 1;
            if (targetMag < 250) {
                arrowOpacity = Math.max(0, (targetMag - 125) / 125);
            }
            arrow.style.opacity = arrowOpacity;

            // X Marker Screen Mapping & Stars Logic
            let destMarker = document.getElementById('dest-marker');
            if (destMarker) {
                // Translated inside the 3D map layer, counter-rotated to remain fully 2D and readable,
                // floated slightly to avoid clipping through the flat map background.
                destMarker.style.transform = `translate(${DEST_X}px, ${DEST_Y}px) translate(-50%, -50%) rotateX(-40deg) translateZ(10px)`;

                // Uncover X's stars only when the arrow is highly faded (opacity < 0.25 is 75% invisible)
                let destStars = destMarker.querySelector('.dest-stars');
                if (arrowOpacity < 0.25) {
                    destStars.style.opacity = 1;
                } else {
                    destStars.style.opacity = 0;
                }
            }

            // 5. Wrong Way Toast Logic
            if (time - lastDistTime > 500) {
                pathHistory.push({x: map_x, y: map_y});
                if (pathHistory.length > 5) pathHistory.shift();

                let toast = document.getElementById('toast');
                if (pathHistory.length === 5) {
                    let oldest = pathHistory[0];
                    let dy = map_y - oldest.y; 
                    let dx = map_x - oldest.x; 

                    // In this map, West corresponds to positive Y movement.
                    // Only show "Wrong Way" if heading strongly West (ignoring North/South).
                    if (dy > 15 && Math.abs(dy) > Math.abs(dx) * 1.5) {
                        toast.classList.add('show');
                    } else {
                        toast.classList.remove('show');
                    }
                }
                lastDistTime = time;
            }

            requestAnimationFrame(updateFrame);
        }

        function spawnFootprint(x, y, angle) {
            let fp = document.createElement('div');
            fp.className = 'footprint';
            fp.style.left = `${x}px`;
            fp.style.top = `${y}px`;
            fp.style.opacity = 1;
            
            // Angle footprint out slightly
            let printAngle = angle + (isLeftFoot ? -0.15 : 0.15);
            let deg = printAngle * 180 / Math.PI + 90;
            let scaleX = isLeftFoot ? 1 : -1;
            // The footprint rotates to match the path, but does NOT rotate relative to screen afterwards
            fp.style.transform = `translate(-50%, -50%) rotate(${deg}deg)`;
            
            // Asymmetrical shoe print design inside footprint-inner to allow entrance animation without overriding transform
            fp.innerHTML = `
                <div class="footprint-inner">
                    <svg viewBox="0 0 24 55" style="width:100%; height:100%; transform: scaleX(${scaleX});">
                        <path fill="#492210" d="M14,3 C8,2 3,10 5,22 C6,28 14,30 18,24 C22,14 20,4 14,3 Z M12,35 C8,35 6,42 8,48 C10,53 14,53 16,48 C18,42 16,35 12,35 Z" />
                    </svg>
                </div>`;
            
            document.getElementById('background').appendChild(fp);
            activeFootprints.push(fp);

            // Keep only a certain number of footprints
            const MAX_FOOTPRINTS = 20;
            // Fade out old footprints
            activeFootprints.forEach((f, index) => {
                let age = activeFootprints.length - index;
                if (age > MAX_FOOTPRINTS - 5) {
                    let fadeOutRatio = 1 - (age - (MAX_FOOTPRINTS - 5)) * 0.2;
                    f.style.opacity = Math.max(0, fadeOutRatio);
                } else {
                    f.style.opacity = 1;
                }
            });

            // Remove very old ones
            if (activeFootprints.length > MAX_FOOTPRINTS) {
                let removed = activeFootprints.shift();
                if (removed.parentNode) removed.remove();
            }
        }
    </script>
</body>
