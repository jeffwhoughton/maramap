<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Marauder's Map</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&display=swap" rel="stylesheet">
    <style>
        body, html {
            margin: 0; padding: 0;
            width: 100vw; height: 100vh;
            overflow: hidden;
            background-color: #f0cfa6;
            font-family: 'Cinzel', 'Georgia', serif;
            user-select: none;
            -webkit-user-select: none;
        }

        /* 3D Pitched Perspective */
        #map-container {
            perspective: 800px;
            width: 100vw;
            height: 100vh;
            position: relative;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        #map-layer {
            position: absolute;
            left: 50%; top: 50%;
            /* Pitches the map backward to give depth */
            transform: rotateX(40deg) scale(0.7);
            transform-style: preserve-3d;
            width: 0; height: 0; /* Centered origin point */
        }

        #background {
            position: absolute;
            left: 0; top: 0;
            width: 4092px; height: 6120px;
            background-image: url('background.png');
            background-size: 100% 100%;
            transform-origin: 0 0;
            /* Added smooth transitions for non-linear bumps */
            will-change: transform;
        }

        /* UI Elements */
        .map-label {
            position: absolute;
            color: #492210;
            font-size: 45px;
            font-weight: bold;
            text-shadow: 2px 2px 6px #f5dbbc, -2px -2px 6px #f5dbbc, 2px -2px 6px #f5dbbc, -2px 2px 6px #f5dbbc;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.5s ease;
            white-space: nowrap;
            z-index: 5;
        }

        .footprint {
            position: absolute;
            width: 25px; height: 50px;
            opacity: 0;
            filter: drop-shadow(2px 2px 6px #f5dbbc);
            transform-origin: center center;
            transition: opacity 0.5s ease, transform 0.5s ease;
            z-index: 2;
        }

        .footprint-inner {
            width: 100%; height: 100%;
            animation: footstep 0.4s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
        }

        @keyframes footstep {
            0% { opacity: 0; transform: scale(0.8) translateY(10px); }
            100% { opacity: 1; transform: scale(1) translateY(0); }
        }

        #arrow {
            position: absolute;
            width: 50px; height: 50px;
            filter: drop-shadow(2px 2px 6px #f5dbbc);
            margin-left: -25px; margin-top: -25px;
            z-index: 10;
            transition: left 0.1s linear, top 0.1s linear;
        }

        #toast {
            position: absolute;
            bottom: -80px; left: 50%;
            transform: translateX(-50%);
            background: #492210;
            color: #f0cfa6;
            padding: 15px 40px;
            border-radius: 30px;
            font-size: 22px;
            font-weight: bold;
            transition: bottom 0.4s ease;
            z-index: 20;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            pointer-events: none;
        }
        #toast.show { bottom: 50px; }

        #start-screen {
            position: absolute;
            top: 0; left: 0; width: 100vw; height: 100vh;
            background: rgba(240, 207, 166, 0.95);
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            font-size: 32px; color: #492210; font-weight: bold;
            z-index: 100; text-align: center; padding: 20px;
            box-sizing: border-box;
            gap: 40px;
        }

        #start-button {
            background-color: #492210;
            color: #f0cfa6;
            border: none;
            padding: 15px 50px;
            font-family: 'Cinzel', 'Georgia', serif;
            font-size: 28px;
            font-weight: bold;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 2px 2px 6px rgba(0,0,0,0.3);
            transition: transform 0.1s, box-shadow 0.1s;
        }
        
        #start-button:active {
            transform: translateY(2px);
            box-shadow: 0 0 2px rgba(0,0,0,0.3);
        }
    </style>
</head>
<body>

    <div id="start-screen">
        <div>I solemnly swear that I am up to no good.</div>
        <button id="start-button" onclick="startApp()">START</button>
    </div>

    <div id="map-container">
        <div id="map-layer">
            <div id="background"></div>
        </div>
    </div>

    <!-- UI Overlay Layer -->
    <div id="arrow">
        <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" style="width:100%; height:100%;">
            <path fill="#492210" d="M50,10 L85,85 L50,65 L15,85 Z" />
        </svg>
    </div>
    
    <div id="toast">Wrong Way</div>

    <script>
        // System Config
        const INITIAL_X = 2062;
        const INITIAL_Y = 3364;
        const DEST_X = 1655;
        const DEST_Y = 1252;
        const PIXELS_PER_METER = 45;

        // Coordinates & Tracking
        let target_map_x = INITIAL_X;
        let target_map_y = INITIAL_Y;
        let map_x = INITIAL_X;
        let map_y = INITIAL_Y;

        let firstPos = null;
        let gpsHistory = [];
        let distHistory =[];
        let lastDistTime = 0;

        // Footprint state
        let last_footprint_x = INITIAL_X;
        let last_footprint_y = INITIAL_Y;
        let isLeftFoot = true;
        let activeFootprints = [];

        // Labels definitions
        const labelData =[
            { name: "Manor", x: 2022, y: 3336 },
            { name: "Garden", x: 1302, y: 4464 },
            { name: "Great Hall", x: 1476, y: 4438 },
            { name: "Road", x: 2070, y: 5232 },
            { name: "The Hill", x: 1374, y: 3390 },
            { name: "Back Grounds", x: 2202, y: 2634 },
            { name: "Forbidden Forest", x: 1428, y: 1974 },
            { name: "Hippogriff Enclosure", x: 1206, y: 2220 },
            { name: "Stomping Yard", x: 1392, y: 1302 }
        ];

        let labels = labelData.map((l, i) => ({
            id: 'label-' + i, name: l.name,
            targetX: l.x, targetY: l.y,
            x: l.x, y: l.y, vx: 0, vy: 0
        }));

        function startApp() {
            document.getElementById('start-screen').style.display = 'none';
            initMap();

            if (navigator.geolocation) {
                navigator.geolocation.watchPosition(
                    pos => {
                        let lat = pos.coords.latitude;
                        let lon = pos.coords.longitude;
                        if (!firstPos) firstPos = { lat, lon };

                        // Deltas in degrees mapping to meters
                        let dLat = lat - firstPos.lat;
                        let dLon = lon - firstPos.lon;

                        let dy_meters = dLon * 111320 * Math.cos(firstPos.lat * Math.PI / 180); // East
                        let dx_meters = dLat * 111320; // North
                        
                        // Top of screen is East, Left of screen is North
                        let new_target_x = INITIAL_X - (dx_meters * PIXELS_PER_METER); 
                        let new_target_y = INITIAL_Y - (dy_meters * PIXELS_PER_METER); 

                        // Accumulate and average GPS to prevent jitter
                        gpsHistory.push({ x: new_target_x, y: new_target_y });
                        if (gpsHistory.length > 5) gpsHistory.shift();

                        target_map_x = gpsHistory.reduce((s, p) => s + p.x, 0) / gpsHistory.length;
                        target_map_y = gpsHistory.reduce((s, p) => s + p.y, 0) / gpsHistory.length;
                    },
                    err => console.warn(err),
                    { enableHighAccuracy: true, maximumAge: 1000, timeout: 5000 }
                );
            }
            
            // Fallback bindings for Desktop testing
            window.addEventListener('keydown', (e) => {
                if (e.key === 'ArrowUp') target_map_y -= 50;   // Walk East
                if (e.key === 'ArrowDown') target_map_y += 50; // Walk West
                if (e.key === 'ArrowLeft') target_map_x -= 50; // Walk North
                if (e.key === 'ArrowRight') target_map_x += 50;// Walk South
                gpsHistory.push({ x: target_map_x, y: target_map_y });
                if (gpsHistory.length > 5) gpsHistory.shift();
            });

            requestAnimationFrame(updateFrame);
        }

        function initMap() {
            let bg = document.getElementById('background');

            // Draw Destination marker on background
            let destMarker = document.createElement('div');
            destMarker.style.cssText = `position: absolute; left: ${DEST_X}px; top: ${DEST_Y}px; color: #492210; font-size: 80px; transform: translate(-50%, -50%) rotateX(-40deg); text-shadow: 2px 2px 6px #f5dbbc, -2px -2px 6px #f5dbbc; z-index: 1;`;
            destMarker.textContent = 'X';
            bg.appendChild(destMarker);

            // Setup Labels
            labels.forEach(l => {
                let el = document.createElement('div');
                el.className = 'map-label';
                el.id = l.id;
                el.textContent = l.name;
                bg.appendChild(el);
            });
        }

        function updateFrame(time) {
            // 1. Smooth Camera Glide
            map_x += (target_map_x - map_x) * 0.05;
            map_y += (target_map_y - map_y) * 0.05;
            
            document.getElementById('background').style.transform = `translate(${-map_x}px, ${-map_y}px)`;
            
            // 2. Footprint Spawning
            let distWalked = Math.hypot(map_x - last_footprint_x, map_y - last_footprint_y);
            if (distWalked > 30) {
                let angle = Math.atan2(map_y - last_footprint_y, map_x - last_footprint_x);
                // Offset left or right foot relative to path
                let offsetX = Math.cos(angle + Math.PI/2) * (isLeftFoot ? -12 : 12);
                let offsetY = Math.sin(angle + Math.PI/2) * (isLeftFoot ? -12 : 12);
                
                spawnFootprint(map_x + offsetX, map_y + offsetY, angle);
                
                last_footprint_x = map_x;
                last_footprint_y = map_y;
                isLeftFoot = !isLeftFoot;
            }

            // 3. Label Physics Engine
            let visibleW = window.innerWidth;
            let visibleH = window.innerHeight / 0.64; // Compensate for 50deg Pitch
            let pad = 100;

            labels.forEach(l => {
                // Spring towards anchor point
                l.vx += (l.targetX - l.x) * 0.01;
                l.vy += (l.targetY - l.y) * 0.01;

                // Center Screen Repulsion
                let distC = Math.hypot(l.x - map_x, l.y - map_y);
                if (distC < 300) {
                    let pushUp = 200 * (1 - distC / 300);
                    l.vy -= pushUp * 0.03; // Smooth push towards Top of map (-Y)
                    l.vx += (l.x - map_x) * 0.005; 
                }

                // Overlap (Node) Repulsion
                labels.forEach(l2 => {
                    if (l === l2) return;
                    let dx2 = l.x - l2.x;
                    let dy2 = l.y - l2.y;
                    let dist2 = Math.hypot(dx2, dy2);
                    if (dist2 < 300 && dist2 > 0) {
                        let force = (300 - dist2) * 0.01;
                        l.vx += (dx2 / dist2) * force;
                        l.vy += (dy2 / dist2) * force;
                    }
                });

                // Screen Padding Repulsion (only for those expected to be onscreen)
                let isTargetVisible = Math.abs(l.targetX - map_x) < visibleW/2 && Math.abs(l.targetY - map_y) < visibleH/2;
                if (isTargetVisible) {
                    let leftEdge = map_x - visibleW/2 + pad;
                    let rightEdge = map_x + visibleW/2 - pad;
                    let topEdge = map_y - visibleH/2 + pad;
                    let bottomEdge = map_y + visibleH/2 - pad;

                    if (l.x < leftEdge) l.vx += (leftEdge - l.x) * 0.05;
                    if (l.x > rightEdge) l.vx -= (l.x - rightEdge) * 0.05;
                    if (l.y < topEdge) l.vy += (topEdge - l.y) * 0.05;
                    if (l.y > bottomEdge) l.vy -= (l.y - bottomEdge) * 0.05;
                }

                // Apply Friction & Speed
                l.vx *= 0.8; l.vy *= 0.8;
                l.x += l.vx; l.y += l.vy;

                // Visibility Threshold (anti-flicker managed by CSS transition)
                let el = document.getElementById(l.id);
                // Counter-rotate the label text by -40deg to keep it facing the camera squarely
                el.style.transform = `translate(-50%, -50%) translate(${l.x}px, ${l.y}px) rotateX(-40deg)`;
                if (Math.abs(l.x - map_x) < visibleW/2 + 200 && Math.abs(l.y - map_y) < visibleH/2 + 200) {
                    el.style.opacity = 1;
                } else {
                    el.style.opacity = 0;
                }
            });

            // 4. Arrow Navigation
            let arrow = document.getElementById('arrow');
            let dX = DEST_X - map_x;
            let dY = DEST_Y - map_y;
            let angle = Math.atan2(dY * 0.76, dX); // 0.76 compensates for 40deg Y compression
            
            let arrW = window.innerWidth / 2 - 50;
            let arrH = window.innerHeight / 2 - 50;

            let absCos = Math.abs(Math.cos(angle));
            let absSin = Math.abs(Math.sin(angle));
            let mag = Math.min(arrW / absCos, arrH / absSin);

            // Screen intersection (0.7 is our map layer scale)
            let screenDx = dX * 0.7;
            let screenDy = dY * 0.7 * 0.76;

            if (Math.abs(screenDx) < arrW && Math.abs(screenDy) < arrH) {
                arrow.style.left = `calc(50% + ${screenDx}px)`;
                arrow.style.top = `calc(50% + ${screenDy}px)`;
            } else {
                arrow.style.left = `calc(50% + ${Math.cos(angle) * mag}px)`;
                arrow.style.top = `calc(50% + ${Math.sin(angle) * mag}px)`;
            }

            let arrowDeg = angle * 180 / Math.PI + 90;
            arrow.style.transform = `rotate(${arrowDeg}deg)`;

            // 5. Wrong Way Toast Logic
            if (time - lastDistTime > 1000) {
                let currentDist = Math.hypot(DEST_X - map_x, DEST_Y - map_y);
                distHistory.push(currentDist);
                if (distHistory.length > 5) distHistory.shift();

                let toast = document.getElementById('toast');
                if (currentDist > 300 && distHistory.length === 5) {
                    let oldestDist = distHistory[0];
                    if (currentDist > oldestDist + 10) {
                        toast.classList.add('show');
                    } else if (currentDist < oldestDist - 10) {
                        toast.classList.remove('show');
                    }
                } else if (currentDist <= 300) {
                    toast.classList.remove('show');
                }
                lastDistTime = time;
            }

            requestAnimationFrame(updateFrame);
        }

        function spawnFootprint(x, y, angle) {
            let fp = document.createElement('div');
            fp.className = 'footprint';
            fp.style.left = `${x}px`;
            fp.style.top = `${y}px`;
            fp.style.opacity = 1;
            
            let deg = angle * 180 / Math.PI + 90;
            let scaleX = isLeftFoot ? 1 : -1;
            // The footprint rotates to match the path, but does NOT rotate relative to screen afterwards
            fp.style.transform = `translate(-50%, -50%) rotate(${deg}deg)`;
            
            // Asymmetrical shoe print design inside footprint-inner to allow entrance animation without overriding transform
            fp.innerHTML = `
                <div class="footprint-inner">
                    <svg viewBox="0 0 24 55" style="width:100%; height:100%; transform: scaleX(${scaleX});">
                        <path fill="#492210" d="M14,3 C8,2 3,10 5,22 C6,28 14,30 18,24 C22,14 20,4 14,3 Z M12,35 C8,35 6,42 8,48 C10,53 14,53 16,48 C18,42 16,35 12,35 Z" />
                    </svg>
                </div>`;
            
            document.getElementById('background').appendChild(fp);
            activeFootprints.push(fp);

            // Keep only a certain number of footprints
            const MAX_FOOTPRINTS = 20;
            // Fade out old footprints
            activeFootprints.forEach((f, index) => {
                let age = activeFootprints.length - index;
                if (age > MAX_FOOTPRINTS - 5) {
                    let fadeOutRatio = 1 - (age - (MAX_FOOTPRINTS - 5)) * 0.2;
                    f.style.opacity = Math.max(0, fadeOutRatio);
                } else {
                    f.style.opacity = 1;
                }
            });

            // Remove very old ones
            if (activeFootprints.length > MAX_FOOTPRINTS) {
                let removed = activeFootprints.shift();
                if (removed.parentNode) removed.remove();
            }
        }
    </script>
</body>
</html>
